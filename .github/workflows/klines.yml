name: update-klines

on:
  schedule:
    - cron: "17 0 * * *"      # daily 00:17 UTC, after the 00:00 UTC daily close
    - cron: "17 3 * * *"      # backup 03:17 UTC (scheduled runs dropped/delayed repeatedly since 11-22)
    - cron: "47 7 * * *"      # backup 07:47 UTC (= 16:47 KST, before the 17:53 KST chart-ta scan); incremental fetch
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/klines.yml"
      - "REFRESH"

permissions:
  contents: write

concurrency:
  group: update-klines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Previous data (incremental)
        run: |
          git clone -q --depth 1 -b data "https://github.com/${{ github.repository }}.git" "${{ runner.temp }}/prev" || mkdir -p "${{ runner.temp }}/prev"

      - name: Fetch
        env:
          OUT_DIR: ${{ runner.temp }}/out
          PREV_DIR: ${{ runner.temp }}/prev
        run: python scripts/fetch_klines.py

      # data branch is a single orphan commit, force-pushed each run: repo size stays flat
      - name: Publish to data branch
        env:
          OUT_DIR: ${{ runner.temp }}/out
        run: |
          cd "$OUT_DIR"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "klines $(jq -r '.last_daily_close // .status' meta.json)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
